# Alembic configuration. The database URL is not set here on purpose: it is
# resolved at runtime from the same place every other setting comes from
# (env var -> saved config -> .env -> SQLite default), see app/migrations/env.py.
# So `alembic upgrade head` and the app's own startup both target whatever
# database the app is actually configured to use.
[alembic]
script_location = app/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
