version: 2
# Weekly, grouped updates so dependency PRs stay few and reviewable.
updates:
  - package-ecosystem: pip
    directory: /
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /frontend
    schedule: {interval: weekly}
    groups: {frontend: {patterns: ["*"]}}
  - package-ecosystem: npm
    directory: /desktop
    schedule: {interval: weekly}
    groups: {desktop: {patterns: ["*"]}}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
